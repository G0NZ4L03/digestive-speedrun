<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#121212" rx="100"/>
  
  <!-- Stomach icon simplified -->
  <g transform="translate(130, 100)">
    <!-- Stomach outline -->
    <path d="M50 80 Q30 120 40 180 Q50 240 100 260 Q150 280 180 250 Q210 220 200 160 Q190 100 140 80 Q90 60 50 80" 
          fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Clock hands suggesting timing -->
    <circle cx="120" cy="170" r="40" fill="#1E1E1E" stroke="#10B981" stroke-width="8"/>
    <line x1="120" y1="170" x2="120" y2="140" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="145" y2="185" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Small checkmark for success -->
    <path d="M80 120 L95 135 L115 110" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text: DS (Digestive SpeedRun) -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#10B981">DS</text>
</svg>
